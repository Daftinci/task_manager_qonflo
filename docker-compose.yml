services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # initiates the single-node replica set (needed for transactions) on first run
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  backend:
    build: ./backend
    environment:
      MONGO_URI: mongodb://mongo:27017/taskmanager?replicaSet=rs0
      PORT: 5001
    ports:
      - "5001:5001"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:5001
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo-data:
